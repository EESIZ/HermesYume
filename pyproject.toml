[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermesyume"
version = "2.0.0.dev0"
description = "HermesYume v2: nightly memory consolidation (Yume) for Hermes Agent, LanceDB canonical store"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
# Exact pins live in requirements-dream.txt (uv pip compile). These are the policy ranges (PLAN-v2 §8.2).
dependencies = [
    "lancedb>=0.39,<0.40",
    "pyarrow>=25,<26",
    "numpy>=2.4,<3",
    "openai>=2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yume = "hermesyume.cli:main"

[tool.setuptools]
# Packages listed explicitly: provider/ is mapped into the wheel (below) and must not be imported.
packages = [
    "hermesyume",
    "hermesyume.sources",
    "hermesyume.vendor",
    "hermesyume._provider",
    "hermesyume._provider._yume",
]
include-package-data = false

[tool.setuptools.package-dir]
# provider/ is shipped inside the wheel (single source, no copy) so an installed (non-editable)
# dream venv can load provider/_yume/live_schema.py by path. It is never imported as a package.
"hermesyume._provider" = "provider"

[tool.setuptools.package-data]
"hermesyume._provider" = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/dream"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
